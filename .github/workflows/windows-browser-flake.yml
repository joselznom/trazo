name: windows-browser-flake

# Experiment, never merged: how often and why a viewer test in Chrome times out on
# Windows. Each job loops the browser tests (or the whole package suite) for 35 minutes
# with the request and page tracing of tests/_browser_trace.py, and samples the
# machine's load and loopback sockets every 5 seconds. Defender stays as the runner
# image sets it (tracing only); its state is recorded, not changed. Push the branch
# experiment/windows-browser-flake to run it.
on:
  push:
    branches: [experiment/windows-browser-flake]

permissions:
  contents: read

concurrency:
  group: windows-browser-flake-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: browser-1, scope: browser}
          - {arm: browser-2, scope: browser}
          - {arm: suite, scope: suite}
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Pandoc and pandoc-crossref
        run: |
          . scripts/ci-versions.sh
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/pandoc.zip" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-windows-x86_64.zip"
          unzip -q -j "$RUNNER_TEMP/pandoc.zip" '*/pandoc.exe' -d "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/crossref.7z" "https://github.com/lierdakil/pandoc-crossref/releases/download/${CROSSREF_VERSION}/pandoc-crossref-Windows-X64.7z"
          7z e -o"$RUNNER_TEMP/tools" "$RUNNER_TEMP/crossref.7z" pandoc-crossref.exe > /dev/null
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Turn the desktop's animations on, as windows.yml does
        shell: pwsh
        run: |
          Add-Type -Namespace Win -Name User -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);'
          if (-not [Win.User]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3)) { throw "SystemParametersInfo failed" }
      - name: Git identity for the test papers
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Machine, Chrome and Defender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\flake" | Out-Null
          & {
            "chrome: " + (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe").VersionInfo.ProductVersion
            Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors
            Get-MpComputerStatus | Format-List AMServiceEnabled, RealTimeProtectionEnabled, IsTamperProtected
            "exclusions: " + ((Get-MpPreference).ExclusionPath -join "; ")
            netsh int ipv4 show dynamicport tcp
          } *>&1 | Tee-Object "$env:RUNNER_TEMP\flake\machine.txt"
      - name: Start the sampler
        shell: pwsh
        run: |
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File',
            "$env:GITHUB_WORKSPACE\scripts\windows-flake\sample.ps1", '-Out', "$env:RUNNER_TEMP\flake\samples.jsonl"
      - name: Loop for 35 minutes
        # A pass that starts just before the deadline still finishes (a suite pass takes
        # about 10 minutes). The step's own limit, under the job's, keeps the upload below.
        timeout-minutes: 48
        run: |
          if [ "${{ matrix.scope }}" = suite ]; then
            modules=discover
          else
            modules="$(cd packages/trazo/tests && ls test_preview_browser_*.py | sed 's/\.py$//' | tr '\n' ' ') test_preview_source_history"
          fi
          uv run --quiet --project packages/trazo python scripts/windows-flake/loop.py \
            --minutes 35 --out "$RUNNER_TEMP/flake/passes" $modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: flake-${{ matrix.arm }}
          path: ${{ runner.temp }}/flake

# Keeps the SHA-pinned actions in .github/workflows current. Pull requests go
# to develop, the working branch; main moves only at releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

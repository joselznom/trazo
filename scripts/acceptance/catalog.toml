# The acceptance scenarios. A scenario is a row here; its implementation is a
# function registered with @scenario("<id>") in scripts/acceptance/<level>/.
# Without one it is reported "not automated", never as passed.
#
#   id      <level>-<name>, unique
#   level   n1 plugin driven like the app (MCP, hook, setup.sh)
#           n2 the real claude and codex CLIs
#   source  where the check comes from: "docs/plugin.md check N" (N counts the
#           "Checks by hand" list from 1) or "new"
#   areas   repo path globs (`*` stays in a folder, `**` crosses folders): a
#           change to one selects the scenario with `run.py --changed-from`.
#           They come on top of `checkout_areas`, shared by the scenarios that
#           install and run the checkout's real plugin (a change anywhere in it
#           can break them).
#   checkout  false for a scenario that never touches the plugin (true by default)

checkout_areas = [
    "packages/trazo/src/trazo/**",
    "packages/trazo/pyproject.toml",
    "packages/trazo/uv.lock",
    "copier.yml",
    "plugin/**",
    "hooks/**",
    ".claude-plugin/**",
    ".codex-plugin/**",
    ".codex-mcp.json",
]

[[scenario]]
id = "n1-sandbox"
level = "n1"
title = "The sandbox keeps a run away from the real home, data folder and CLI configuration"
source = "new"
checkout = false
areas = ["scripts/acceptance/**"]


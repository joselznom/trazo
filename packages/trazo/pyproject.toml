[project]
name = "trazo"
version = "1.0.0"
description = "Preview, diagrams and checks for Markdown papers built with Pandoc."
readme = "README.md"
# The bundled template copy is MIT-0 (LICENSE-template at the repository root), its IEEE CSL style
# CC BY-SA 3.0 (licence in the file); the fonts are OFL.
license = "MIT AND MIT-0 AND CC-BY-SA-3.0 AND OFL-1.1"
license-files = ["LICENSE", "src/trazo/assets/preview/OFL-*.txt"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
trazo = "trazo.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501: long lines wait for `ruff format`, which waits for the large files to be split.
# E731: the code names short lambdas on purpose (many already carry `noqa: E731`).
ignore = ["E501", "E731"]

[tool.mypy]
# Reports only (`make typecheck`); nothing blocks on it yet. A module that comes back clean
# joins the strict override below, so it cannot regress.
files = ["src"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "trazo",
    "trazo.__main__",
    "trazo.agents",
    "trazo.build_lock",
    "trazo.mcp_app",
    "trazo.page_bundle",
    "trazo.pandoc_options",
    "trazo.preview_inputs",
    "trazo.preview_updates",
    "trazo.resources",
    "trazo.review_history",
    "trazo.review_storage",
    "trazo.svg_export",
    "trazo.uv_sync",
]
# The per-module parts of --strict (`strict` itself only works globally).
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
extra_checks = true
